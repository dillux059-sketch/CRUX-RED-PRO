name: Build CRUX RED PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'crux_red_pro.html'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/crux/redpro
          cp crux_red_pro.html app/src/main/assets/index.html

          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name='CruxRedPro'; include ':app'" > settings.gradle

          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle

          echo "plugins { id 'com.android.application' }; android { namespace 'com.crux.redpro'; compileSdk 35; defaultConfig { applicationId 'com.crux.redpro'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' } }" > app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="CRUX RED PRO">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/crux/redpro/MainActivity.java <<'EOF'
          package com.crux.redpro;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CRUX-RED-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
